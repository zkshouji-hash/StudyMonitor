plugins {
    id 'com.android.application' version '8.1.0'
}

android {
    namespace 'com.monitor.m1l'
    compileSdk 33

    defaultConfig {
        applicationId "com.monitor.m1l"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
